<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitCloud | Cloud Bus Pass System</title>
    <meta name="description" content="Book your cloud transit pass in seconds — secure, instant, and hassle-free.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                <span>TransitCloud</span>
            </div>
            <nav class="nav-links">
                <a href="#" class="active" id="nav-book">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                    <span>Book Pass</span>
                </a>
                <a href="#" id="nav-tickets">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span>My Tickets</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>

        <div class="app-container">
            <!-- Booking View -->
            <section id="view-book" class="view-section active">
                <div class="card premium-card">
                    <div class="card-header">
                        <h2>Book Your Pass</h2>
                        <p class="subtitle">Secure your transit route instantly.</p>
                    </div>

                    <form id="booking-form">
                        <div class="form-group">
                            <label for="user_name">Full Name</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                <input type="text" id="user_name" name="user_name" required placeholder="Ahmed Hamed">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="user_email">Email Address</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                <input type="email" id="user_email" name="user_email" required placeholder="ahmed@example.com">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="trip_name">Select Route</label>
                            <div class="input-wrapper select-wrapper">
                                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                <select id="trip_name" name="trip_name" required>
                                    <option value="" disabled selected>Choose your destination...</option>
                                    <option value="Downtown Express">Downtown Express — $2.50</option>
                                    <option value="City Loop">City Loop — $3.00</option>
                                    <option value="Suburbs Route">Suburbs Route — $5.00</option>
                                    <option value="Airport Shuttle">Airport Shuttle — $15.00</option>
                                </select>
                            </div>
                        </div>

                        <div id="booking-alert" class="alert hidden"></div>

                        <button type="submit" class="btn primary-btn" id="submit-btn" aria-label="Book Now">
                            <span>Confirm Booking</span>
                            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                            <span class="spinner hidden"></span>
                        </button>
                    </form>
                </div>
            </section>

            <!-- Tickets View -->
            <section id="view-tickets" class="view-section hidden">
                <div class="dashboard-header">
                    <h2>Recent Bookings</h2>
                    <p class="subtitle">Manage and track your active transit passes.</p>
                </div>

                <div id="tickets-alert" class="alert hidden"></div>

                <div class="tickets-container" id="tickets-container">
                    <div class="loading-state">
                        <div class="loader"></div>
                        <p>Fetching your tickets...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navBook = document.getElementById('nav-book');
            const navTickets = document.getElementById('nav-tickets');
            const viewBook = document.getElementById('view-book');
            const viewTickets = document.getElementById('view-tickets');

            const bookingForm = document.getElementById('booking-form');
            const bookingAlert = document.getElementById('booking-alert');
            const submitBtn = document.getElementById('submit-btn');
            const spinner = submitBtn.querySelector('.spinner');
            const btnIcon = submitBtn.querySelector('.btn-icon');

            const ticketsContainer = document.getElementById('tickets-container');
            const ticketsAlert = document.getElementById('tickets-alert');

            // Navigation
            navBook.addEventListener('click', (e) => {
                e.preventDefault();
                navTickets.classList.remove('active');
                navBook.classList.add('active');
                viewTickets.classList.add('hidden');
                viewBook.classList.remove('hidden');
                document.querySelector('.app-container').style.maxWidth = '650px';
            });

            navTickets.addEventListener('click', (e) => {
                e.preventDefault();
                navBook.classList.remove('active');
                navTickets.classList.add('active');
                viewBook.classList.add('hidden');
                viewTickets.classList.remove('hidden');
                document.querySelector('.app-container').style.maxWidth = '1000px';
                fetchTickets();
            });

            function showAlert(element, message, type) {
                const icon = type === 'success'
                    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`
                    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
                element.innerHTML = `${icon} <span>${message}</span>`;
                element.className = `alert ${type}`;
                element.classList.remove('hidden');
            }

            // Book Ticket
            bookingForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                bookingAlert.classList.add('hidden');
                submitBtn.disabled = true;
                spinner.classList.remove('hidden');
                btnIcon.classList.add('hidden');

                const payload = {
                    user_name: document.getElementById('user_name').value,
                    user_email: document.getElementById('user_email').value,
                    trip_name: document.getElementById('trip_name').value
                };

                try {
                    const response = await fetch('/api/book', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to book ticket');
                    }

                    showAlert(bookingAlert, data.message, 'success');
                    bookingForm.reset();

                } catch (error) {
                    showAlert(bookingAlert, error.message, 'error');
                } finally {
                    submitBtn.disabled = false;
                    spinner.classList.add('hidden');
                    btnIcon.classList.remove('hidden');
                }
            });

            // Fetch Tickets
            async function fetchTickets() {
                ticketsContainer.innerHTML = `
                    <div class="loading-state">
                        <div class="loader"></div>
                        <p>Fetching your tickets...</p>
                    </div>`;
                ticketsAlert.classList.add('hidden');

                try {
                    const response = await fetch('/api/tickets');
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to fetch tickets');
                    }

                    if (data.length === 0) {
                        ticketsContainer.innerHTML = `
                            <div class="empty-state">
                                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                <h3>No passes found</h3>
                                <p>You haven't booked any transit passes yet.</p>
                                <button class="btn ghost-btn mt-3" onclick="document.getElementById('nav-book').click()">Book a Pass</button>
                            </div>`;
                        return;
                    }

                    ticketsContainer.innerHTML = data.map(ticket => `
                        <div class="ticket-card">
                            <div class="ticket-top">
                                <div class="route-info">
                                    <span class="route-icon">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                    </span>
                                    <span class="ticket-route">${ticket.trip_name}</span>
                                </div>
                                <span class="ticket-price">$${ticket.price.toFixed(2)}</span>
                            </div>
                            <div class="ticket-divider"></div>
                            <div class="ticket-body">
                                <div class="info-row">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                    <span>${ticket.user_name}</span>
                                </div>
                                <div class="info-row">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                    <span>${ticket.user_email}</span>
                                </div>
                            </div>
                            <div class="ticket-footer">
                                <span class="status-badge status-${ticket.status.toLowerCase()}">${ticket.status}</span>
                                <span class="ticket-date">${new Date(ticket.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                            </div>
                        </div>
                    `).join('');

                } catch (error) {
                    showAlert(ticketsAlert, error.message, 'error');
                    ticketsContainer.innerHTML = '';
                }
            }
        });
    </script>
</body>
</html>
